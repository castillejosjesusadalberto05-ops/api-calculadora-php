<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora API HTTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">⚙️ Calculadora HTTP</h1>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Operador 1</label>
                <input type="number" v-model="operador1" placeholder="Ej: 10" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 border focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Operador 2</label>
                <input type="number" v-model="operador2" placeholder="Ej: 5" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 border focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Operación</label>
                <select v-model="operacion" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 border focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Selecciona una operación --</option>
                    <option value="suma">Suma (+)</option>
                    <option value="resta">Resta (-)</option>
                    <option value="multiplicacion">Multiplicación (*)</option>
                    <option value="division">División (/)</option>
                </select>
            </div>

            <button @click="enviarPeticion" :disabled="cargando"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200 disabled:bg-blue-300">
                {{ cargando ? 'Procesando...' : 'Calcular' }}
            </button>
        </div>

        <div class="mt-6">
            <div v-if="cargando" class="text-center text-gray-500">Conectando con la API PHP...</div>

            <div v-if="respuesta && respuesta.ok" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
                <strong class="font-bold">✅ ¡Operación correcta!</strong>
                <span class="block sm:inline"> El resultado es: <strong class="text-xl">{{ respuesta.resultado }}</strong></span>
            </div>

            <div v-if="respuesta && !respuesta.ok" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
                <strong class="font-bold">❌ Error:</strong>
                <span class="block sm:inline"> {{ respuesta.error }}</span>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                // Variables reactivas
                const operador1 = ref('');
                const operador2 = ref('');
                const operacion = ref('');
                const respuesta = ref(null);
                const cargando = ref(false);

                // ⚠️ CAMBIA ESTA URL: 
                // Si trabajas local pon: 'http://localhost/tu-carpeta/backend/calcular.php'
                // Si estás en recuperación y lo subiste a un hosting pon la URL pública de tu PHP
                const API_URL = 'http://localhost/api-calculadora/backend/calcular.php';

                const enviarPeticion = async () => {
                    respuesta.ref = null;
                    cargando.value = true;

                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                operador1: operador1.value,
                                operador2: operador2.value,
                                operacion: operacion.value
                            })
                        });

                        // Guardamos la respuesta JSON del backend PHP
                        respuesta.value = await response.json();
                    } catch (error) {
                        // Captura si el servidor PHP está apagado o la URL está mal
                        respuesta.value = {
                            ok: false,
                            error: 'No se pudo conectar con el servidor backend.'
                        };
                    } finally {
                        cargando.value = false;
                    }
                };

                return {
                    operador1,
                    operador2,
                    operacion,
                    respuesta,
                    cargando,
                    enviarPeticion
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
